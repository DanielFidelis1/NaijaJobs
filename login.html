<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - NaijaJobs</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header class="header">

        <div class="container nav">

            <a href="index.html" class="logo">
                NAIJA<span>JOBS</span>
            </a>

        </div>

    </header>


    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-header">

                <p class="hero-label">
                    WELCOME BACK
                </p>

                <h1>
                    Login to NaijaJobs
                </h1>

                <p>
                    Find jobs, manage your gigs,
                    and grow your income.
                </p>

            </div>


            <form
                id="login-form"
                class="auth-form"
            >

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>


                <p
                    id="login-message"
                    class="auth-message"
                ></p>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="signup.html">
                    Create one
                </a>

            </p>

        </div>

    </main>


    <footer class="footer">

        <div class="container">

            <p>
                © 2026 NaijaJobs. All rights reserved.
            </p>

        </div>

    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/app.js"></script>

</body>

</html>
