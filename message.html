<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chat with employers and job seekers on NaijaJobs.">
    <title>Chat - NaijaJobs</title>
    <link rel="stylesheet" href="css/style.css">


<style>
    /* ========================================
       NAIJAJOBS - MODERN CHAT DESIGN
    ======================================== */

    .nj-chat-page {
        width: min(100% - 32px, 900px);
        margin: 32px auto;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #fff;
        border: 1px solid #e8eaf2;
        border-radius: 20px;
        box-shadow: 0 12px 40px rgba(31, 41, 55, 0.08);
    }

    .nj-chat-header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 20px 24px;
        background: #fff;
        border-bottom: 1px solid #edf0f5;
    }

    .nj-chat-back {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: 9px 12px;
        color: #5148e5;
        background: #f3f2ff;
        border-radius: 10px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition: background 0.2s ease, transform 0.2s ease;
    }

    .nj-chat-back:hover {
        background: #e8e6ff;
        transform: translateX(-2px);
    }

    .nj-chat-back:focus-visible,
    .nj-chat-form button:focus-visible {
        outline: 3px solid #a5b4fc;
        outline-offset: 3px;
    }

    .nj-chat-avatar {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: linear-gradient(135deg, #635bff, #8b5cf6);
        color: #fff;
        font-size: 20px;
        font-weight: 700;
        box-shadow: 0 4px 10px rgba(99, 91, 255, 0.2);
    }

    .nj-chat-header h1 {
        margin: 0;
        color: #20233a;
        font-size: 18px;
        font-weight: 700;
        overflow-wrap: anywhere;
    }

    .nj-chat-header p {
        margin: 5px 0 0;
        color: #73788c;
        font-size: 13px;
        line-height: 1.4;
    }

    .nj-chat-messages {
        display: flex;
        flex-direction: column;
        min-height: 380px;
        height: min(58vh, 600px);
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 24px;
        background-color: #f7f8fc;
        background-image: radial-gradient(#e5e7f0 0.7px, transparent 0.7px);
        background-size: 18px 18px;
        scroll-behavior: smooth;
    }

    .nj-chat-bubble {
        max-width: min(78%, 560px);
        width: fit-content;
        padding: 13px 16px 10px;
        margin-bottom: 14px;
        border-radius: 18px;
        overflow-wrap: anywhere;
        line-height: 1.55;
        animation: nj-chat-appear 0.18s ease-out;
    }

    .nj-chat-bubble p {
        margin: 0 0 7px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .nj-chat-bubble time {
        display: block;
        font-size: 11px;
        line-height: 1.4;
        opacity: 0.75;
        text-align: right;
    }

    .nj-chat-mine {
        align-self: flex-end;
        margin-left: auto;
        color: #fff;
        background: linear-gradient(135deg, #635bff, #5145e5);
        border-bottom-right-radius: 5px;
        box-shadow: 0 3px 8px rgba(99, 91, 255, 0.12);
    }

    .nj-chat-theirs {
        align-self: flex-start;
        margin-right: auto;
        color: #282b40;
        background: #fff;
        border: 1px solid #e8eaf2;
        border-bottom-left-radius: 5px;
        box-shadow: 0 3px 8px rgba(31, 41, 55, 0.04);
    }

    .nj-chat-form {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        padding: 18px 20px;
        background: #fff;
        border-top: 1px solid #edf0f5;
    }

    .nj-chat-form textarea {
        flex: 1;
        min-width: 0;
        min-height: 48px;
        max-height: 140px;
        padding: 13px 15px;
        color: #25283b;
        background: #f8f9fc;
        border: 1px solid #dfe3ee;
        border-radius: 14px;
        resize: vertical;
        font: inherit;
        line-height: 1.5;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .nj-chat-form textarea::placeholder {
        color: #9297a8;
    }

    .nj-chat-form textarea:focus {
        outline: none;
        background: #fff;
        border-color: #817aff;
        box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.1);
    }

    .nj-chat-form button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        align-self: flex-end;
        min-height: 48px;
        padding: 0 23px;
        color: #fff;
        background: #635bff;
        border: 0;
        border-radius: 13px;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        transition: background 0.2s ease, transform 0.2s ease;
    }

    .nj-chat-form button:hover:not(:disabled) {
        background: #5145e5;
        transform: translateY(-1px);
    }

    .nj-chat-form button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .nj-chat-notice {
        padding: 16px;
        margin: 0;
        color: #73788c;
        text-align: center;
        font-size: 14px;
        line-height: 1.6;
    }

    .nj-chat-error {
        color: #b42318;
        background: #fff5f5;
    }

    @keyframes nj-chat-appear {
        from {
            opacity: 0;
            transform: translateY(4px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 600px) {
        .nj-chat-page {
            width: 100%;
            margin: 0;
            min-height: 100dvh;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .nj-chat-header {
            gap: 10px;
            padding: 14px 12px;
        }

        .nj-chat-back {
            padding: 9px;
            font-size: 12px;
        }

        .nj-chat-avatar {
            width: 42px;
            height: 42px;
            font-size: 18px;
        }

        .nj-chat-header h1 {
            font-size: 16px;
        }

        .nj-chat-messages {
            flex: 1;
            height: auto;
            min-height: 300px;
            max-height: none;
            padding: 18px 12px;
        }

        .nj-chat-bubble {
            max-width: 88%;
            padding: 11px 13px 9px;
            font-size: 14px;
        }

        .nj-chat-form {
            gap: 8px;
            padding: 12px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }

        .nj-chat-form textarea {
            min-height: 46px;
            padding: 11px;
            font-size: 16px;
        }

        .nj-chat-form button {
            min-height: 46px;
            padding: 0 16px;
            font-size: 14px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .nj-chat-bubble {
            animation: none;
        }

        .nj-chat-messages {
            scroll-behavior: auto;
        }

        .nj-chat-back,
        .nj-chat-form button {
            transition: none;
        }
    }
</style>

</head>

<body>
    <main class="nj-chat-page">
        <header class="nj-chat-header">
            <a class="nj-chat-back" href="messages.html" aria-label="Back to inbox">← Back</a>
            <div class="nj-chat-avatar" id="chat-avatar">?</div>
            <div>
                <h1 id="chat-name">NaijaJobs Chat</h1>
                <p id="chat-status">Your private conversation</p>
            </div>
        </header>

    <div class="nj-chat-messages" id="chat-messages" aria-live="polite">
        <div class="nj-chat-notice">Loading conversation...</div>
    </div>

    <form class="nj-chat-form" id="chat-form">
        <textarea
            id="chat-input"
            maxlength="5000"
            placeholder="Type your message..."
            aria-label="Your message"
            required
        ></textarea>
        <button type="submit" id="chat-send">Send</button>
    </form>

    <p id="chat-notice" class="nj-chat-notice" role="status"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>

</body>
</html>
